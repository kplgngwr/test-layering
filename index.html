<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dynamic Layer Fetch & Overlay Demo</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <style>
    body { margin:0; padding:0; }
    #map { position:absolute; top:0; bottom:0; width:100%; }
    .control-panel, .legend-panel {
      position: absolute;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 18px 16px 14px 16px;
      z-index: 10;
      font-size: 15px;
      max-width: 340px;
    }
    .control-panel { top: 18px; left: 30px; }
    .legend-panel { bottom: 24px; left: 30px; }
    .legend-panel label { margin-left: 6px; }
    .legend-panel input[type=checkbox] { vertical-align: middle; margin-right: 3px; }
    .legend-panel .layer-status { font-size: 12px; margin-left: 8px; color: #388e3c;}
    .legend-panel .layer-status.cache { color: #999;}
    button, select { margin-top: 8px; margin-bottom: 8px; width: 90%; font-size: 15px;}
    .layer-color { display:inline-block; width:15px; height:15px; border-radius:3px; vertical-align:middle; margin-right: 5px;}
    .layer-color.state { background:#ffb300;}
    .layer-color.district { background:#e53935;}
    .layer-color.water { background:#1976d2;}
    .desc { font-size:13px; color:#666; margin-top:10px;}
  </style>
</head>
<body>
<div id="map"></div>

<!-- Control panel for selection -->
<div class="control-panel">
  <label for="state-select">State</label>
  <select id="state-select">
    <option value="">Select State</option>
    <option value="Odisha">Odisha</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Tripura">Tripura</option>
    <option value="Telangana">Telangana</option>
  </select>
  <label for="district-select">District</label>
  <select id="district-select">
    <option value="">-- All Districts --</option>
    <!-- District options will be dynamically loaded -->
  </select>
  <button id="fetch-btn">Fetch Layer(s)</button>
  <button id="reset-btn">Reset View</button>
  <button id="clear-btn">Clear Layers</button>
  <div class="desc">
    1. Select a State (required). 2. Optionally select a District.<br>
    3. Tick desired layers in legend. 4. Click Fetch Layer(s). No layers shown by default.
  </div>
</div>

<!-- Layer legend & status -->
<div class="legend-panel">
  <b>Layers (select & then Fetch)</b><br>
  <input type="checkbox" id="state-boundary" checked>
    <span class="layer-color state"></span>
    <label for="state-boundary">State Boundary</label>
    <span id="state-status" class="layer-status cache"></span><br>
  <input type="checkbox" id="district-boundary" checked>
    <span class="layer-color district"></span>
    <label for="district-boundary">District Boundary</label>
    <span id="district-status" class="layer-status cache"></span><br>
  <input type="checkbox" id="water-bodies" checked>
    <span class="layer-color water"></span>
    <label for="water-bodies">Surface Water Bodies</label>
    <span id="water-status" class="layer-status"></span><br>
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1Ijoicm9oaXRiaGF0dDI0MzciLCJhIjoiY21mbWRia3NzMDBzMDJrc2J6cXg5aTBqeCJ9.d9SBYA8rSq4chTptEmx69w';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [83, 21.5],
  zoom: 5.2
});

// Layer API endpoints
const STATE_SERVICE = 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/state_boundary/FeatureServer/0';
const DISTRICT_SERVICE = 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/district_boundary/FeatureServer/0';
// Water bodies per state
const WATER_LAYER_BY_STATE = {
  'Madhya Pradesh': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Madhya_pradesh_water_bodies/FeatureServer/0',
  'Tripura': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Tripura_water_bodies/FeatureServer/0',
  'Telangana': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Telangana_Water__Bodies/FeatureServer/0',
  'Odisha': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Odisha_water_bodies/FeatureServer/0'
};
const STATE_CODE = {
  'Odisha': 'OD',
  'Madhya Pradesh': 'MP',
  'Tripura': 'TR',
  'Telangana': 'TG'
};

// Helper for map source/layer management
function removeLayerAndSource(id) {
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(id)) map.removeSource(id);
}

// Layer status UI helpers
function setStatus(id, msg, isCache=false) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'layer-status' + (isCache ? ' cache' : '');
}

// Fetch districts for selected state
document.getElementById('state-select').addEventListener('change', function() {
  const state = this.value;
  setStatus('district-status', '', true);
  const distSelect = document.getElementById('district-select');
  // Reset and disable while loading
  distSelect.innerHTML = `<option value="">-- All Districts --</option>`;
  distSelect.disabled = true;
  if (!state) return;
  // Query distinct districts for selected state (service uses lowercase field names)
  const stateCode = STATE_CODE[state];
  const where = `state='${stateCode}'`;
  const url = `${DISTRICT_SERVICE}/query?where=${encodeURIComponent(where)}&outFields=district&returnDistinctValues=true&returnGeometry=false&f=json`;
  fetch(url)
    .then(res => res.json())
    .then(json => {
      const districts = (json.features || [])
        .map(f => (f.attributes && (f.attributes.district || f.attributes.District)))
        .filter(Boolean)
        .sort((a,b)=>a.localeCompare(b));
      for (const dist of districts) {
        const opt = document.createElement('option');
        opt.value = dist;
        opt.textContent = dist;
        distSelect.appendChild(opt);
      }
    })
    .catch(err => {
      console.warn('Failed to load districts', err);
    })
    .finally(() => {
      distSelect.disabled = false;
    });
});

document.getElementById('fetch-btn').onclick = () => {
  const state = document.getElementById('state-select').value;
  const district = document.getElementById('district-select').value;
  if (!state) {
    alert('Please select a state.');
    return;
  }
  // Clear previous layers
  clearAllLayers();
  // Status update
  setStatus('state-status', 'Loading...', false);
  setStatus('district-status', 'Loading...', false);
  setStatus('water-status', 'Loading...', false);

  // Fetch & show layers as per checkbox
  if (document.getElementById('state-boundary').checked) {
    showStateBoundary(state);
  } else setStatus('state-status', 'Not loaded', true);
  if (document.getElementById('district-boundary').checked) {
    showDistrictBoundary(state, district);
  } else setStatus('district-status', 'Not loaded', true);
  if (document.getElementById('water-bodies').checked) {
    showWaterBodies(state, district);
  } else setStatus('water-status', 'Not loaded', true);
};

document.getElementById('clear-btn').onclick = clearAllLayers;
document.getElementById('reset-btn').onclick = () => {
  map.flyTo({center: [83, 21.5], zoom: 5.2});
};

function clearAllLayers() {
  removeLayerAndSource('state-boundary-layer');
  removeLayerAndSource('district-boundary-layer');
  removeLayerAndSource('water-bodies-layer');
  setStatus('state-status', '', true);
  setStatus('district-status', '', true);
  setStatus('water-status', '', true);
}

// Display State Boundary
function showStateBoundary(state) {
  const stateCode = STATE_CODE[state];
  const whereByCode = `State_Name='${stateCode}'`;
  const whereByName = `State_FSI='${state.replace(/'/g, "''")}'`;
  const urlByCode = `${STATE_SERVICE}/query?where=${encodeURIComponent(whereByCode)}&outFields=*&f=geojson`;
  const urlByName = `${STATE_SERVICE}/query?where=${encodeURIComponent(whereByName)}&outFields=*&f=geojson`;
  fetch(urlByCode)
    .then(r=>r.json())
    .then(first=>{
      if (!first || !first.features || first.features.length===0) {
        return fetch(urlByName).then(r=>r.json());
      }
      return first;
    })
    .then(data=>{
      if (!data || !data.features || data.features.length===0) throw new Error('No state features');
      map.addSource('state-boundary-layer', {type:'geojson', data});
      map.addLayer({
        id: 'state-boundary-layer',
        type: 'line',
        source: 'state-boundary-layer',
        paint: {'line-color':'#ffb300','line-width':4}
      });
      setStatus('state-status', 'Loaded', false);
      const bbox = turf.bbox(data);
      map.fitBounds(bbox, {padding:40, duration:1000});
    })
    .catch(()=>setStatus('state-status', 'Error', false));
}

// Display District Boundary
function showDistrictBoundary(state, district) {
  const stateCode = STATE_CODE[state];
  let where = `state='${stateCode}'`;
  if (district) where += ` AND district='${district}'`;
  const url = `${DISTRICT_SERVICE}/query?where=${encodeURIComponent(where)}&outFields=*&f=geojson`;
  fetch(url)
    .then(r=>r.json())
    .then(data=>{
      map.addSource('district-boundary-layer', {type:'geojson', data});
      map.addLayer({
        id: 'district-boundary-layer',
        type: 'line',
        source: 'district-boundary-layer',
        paint: {'line-color':'#e53935','line-width':2}
      });
      setStatus('district-status', 'Loaded (cache)', true);
    })
    .catch(()=>setStatus('district-status', 'Error', false));
}

// Display Water Bodies
function showWaterBodies(state, district) {
  const layerUrl = WATER_LAYER_BY_STATE[state];
  if (!layerUrl) { setStatus('water-status', 'Not available', false); return; }
  let where = `state='${state}'`;
  const url = `${layerUrl}/query?where=${encodeURIComponent(where)}&outFields=*&f=geojson`;
  fetch(url)
    .then(r=>r.json())
    .then(data=>{
      map.addSource('water-bodies-layer', {type:'geojson', data});
      map.addLayer({
        id: 'water-bodies-layer',
        type: 'fill',
        source: 'water-bodies-layer',
        paint: {'fill-color':'#1976d2','fill-opacity':0.55}
      });
      setStatus('water-status', `Loaded (${data.features.length})`, false);
    })
    .catch(()=>setStatus('water-status', 'Error', false));
}

// Turf.js for bbox calculation (add from CDN)
const turfScript = document.createElement('script');
turfScript.src = 'https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js';
document.head.appendChild(turfScript);
</script>
</body>
</html>
