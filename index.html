<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Dynamic Layer Fetch & Overlay Demo</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .control-panel,
    .legend-panel {
      position: absolute;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      padding: 18px 16px 14px 16px;
      z-index: 10;
      font-size: 15px;
      max-width: 340px;
    }

    .control-panel {
      top: 18px;
      left: 30px;
    }

    .legend-panel {
      bottom: 24px;
      left: 30px;
    }

    .legend-panel label {
      margin-left: 6px;
    }

    .legend-panel input[type=checkbox] {
      vertical-align: middle;
      margin-right: 3px;
    }

    .legend-panel .layer-status {
      font-size: 12px;
      margin-left: 8px;
      color: #388e3c;
    }

    .legend-panel .layer-status.cache {
      color: #999;
    }

    button,
    select {
      margin-top: 8px;
      margin-bottom: 8px;
      width: 90%;
      font-size: 15px;
    }

    .layer-color {
      display: inline-block;
      width: 15px;
      height: 15px;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 5px;
    }

    .layer-color.state {
      background: #ffb300;
    }

    .layer-color.district {
      background: #e53935;
    }

    .layer-color.water {
      background: #1976d2;
    }

    .layer-color.village {
      background: #43a047;
    }

    .desc {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Control panel for selection -->
  <div class="control-panel">
    <label for="state-select">State</label>
    <select id="state-select">
      <option value="">Select State</option>
      <option value="Odisha">Odisha</option>
      <option value="Madhya Pradesh">Madhya Pradesh</option>
      <option value="Tripura">Tripura</option>
      <option value="Telangana">Telangana</option>
    </select>
    <label for="district-select">District</label>
    <select id="district-select">
      <option value="">-- All Districts --</option>
      <!-- District options will be dynamically loaded -->
    </select>
    <label for="village-select">Village</label>
    <select id="village-select">
      <option value="">-- All Villages --</option>
      <!-- Village options will be dynamically loaded -->
    </select>
    <button id="fetch-btn">Fetch Layer(s)</button>
    <button id="reset-btn">Reset View</button>
    <button id="clear-btn">Clear Layers</button>
    <div class="desc">
      1. Select a State (required). 2. Optionally select a District.<br>
      3. Tick desired layers in legend. 4. Click Fetch Layer(s). No layers shown by default.
    </div>
  </div>

  <!-- Layer legend & status -->
  <div class="legend-panel">
    <b>Layers (select & then Fetch)</b><br>
    <input type="checkbox" id="state-boundary" checked>
    <span class="layer-color state"></span>
    <label for="state-boundary">State Boundary</label>
    <span id="state-status" class="layer-status cache"></span><br>
    <input type="checkbox" id="district-boundary" checked>
    <span class="layer-color district"></span>
    <label for="district-boundary">District Boundary</label>
    <span id="district-status" class="layer-status cache"></span><br>
    <input type="checkbox" id="village-boundary" checked>
    <span class="layer-color village"></span>
    <label for="village-boundary">Village Boundary</label>
    <span id="village-status" class="layer-status cache"></span><br>
    <input type="checkbox" id="water-bodies" checked>
    <span class="layer-color water"></span>
    <label for="water-bodies">Surface Water Bodies</label>
    <span id="water-status" class="layer-status"></span><br>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoicm9oaXRiaGF0dDI0MzciLCJhIjoiY21mbWRia3NzMDBzMDJrc2J6cXg5aTBqeCJ9.d9SBYA8rSq4chTptEmx69w';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [83, 21.5],
      zoom: 5.2
    });

    // Layer API endpoints
    const STATE_SERVICE = 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/state_boundary/FeatureServer/0';
    const DISTRICT_SERVICE = 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/district_boundary/FeatureServer/0';
    const VILLAGE_SERVICE = 'https://livingatlas.esri.in/server/rest/services/IAB2024/IAB_Village_2024/MapServer/0';
    // Water bodies per state
    const WATER_LAYER_BY_STATE = {
      'Madhya Pradesh': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Madhya_pradesh_water_bodies/FeatureServer/0',
      'Tripura': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Tripura_water_bodies/FeatureServer/0',
      'Telangana': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Telangana_Water__Bodies/FeatureServer/0',
      'Odisha': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Odisha_water_bodies/FeatureServer/0'
    };
    // Selected value from dropdown is a human name ("Tripura")
    const STATE_CODE = { 'Odisha': 'OD', 'Madhya Pradesh': 'MP', 'Tripura': 'TR', 'Telangana': 'TS' };
    const STATE_NAME_BY_CODE = { OD: 'Odisha', MP: 'Madhya Pradesh', TR: 'Tripura', TS: 'Telangana' };

    function esc(s) { return String(s).replace(/'/g, "''"); } // SQL-escape single quotes

    // Helper for map source/layer management
    function removeLayerAndSource(id) {
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);
    }

    // Layer status UI helpers
    function setStatus(id, msg, isCache = false) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'layer-status' + (isCache ? ' cache' : '');
    }

    // Fetch districts for selected state via district service layer
    document.getElementById('state-select').addEventListener('change', function () {
      const state = this.value;
      setStatus('district-status', '', true);
      const distSelect = document.getElementById('district-select');
      // Reset and disable while loading
      distSelect.innerHTML = `<option value="">-- All Districts --</option>`;
      distSelect.disabled = true;
      if (!state) return;
      // Query distinct districts for selected state (service uses lowercase field names)
      const stateCode = STATE_CODE[state];
      const where = `state='${stateCode}'`;
      const url = `${DISTRICT_SERVICE}/query?where=${encodeURIComponent(where)}&outFields=district&returnDistinctValues=true&returnGeometry=false&f=json`;
      fetch(url)
        .then(res => res.json())
        .then(json => {
          const districts = (json.features || [])
            .map(f => (f.attributes && (f.attributes.district || f.attributes.District)))
            .filter(Boolean)
            .sort((a, b) => a.localeCompare(b));
          for (const dist of districts) {
            const opt = document.createElement('option');
            opt.value = dist;
            opt.textContent = dist;
            distSelect.appendChild(opt);
          }
        })
        .catch(err => {
          console.warn('Failed to load districts', err);
        })
        .finally(() => {
          distSelect.disabled = false;
        });
    });

    // Fetch villages for selected state & district via village service layer
    document.getElementById('district-select').addEventListener('change', function () {
      const district = this.value;
      setStatus('village-status', '', true);
      const villageSelect = document.getElementById('village-select');
      // Reset and disable while loading
      villageSelect.innerHTML = `<option value="">-- All Villages --</option>`;
      villageSelect.disabled = true;
      if (!district) return;
      // Query distinct villages for selected state & district (service uses lowercase field names)
      const where = `state='${state}' AND district='${escapeSql(district)}'`;
      const url = `${VILLAGE_SERVICE}/query?where=${encodeURIComponent(where)}&outFields=${VILLAGE_FIELD}&returnDistinctValues=true&returnGeometry=false&f=json`;
      fetch(url)
        .then(res => res.json())
        .then(json => {
          const villages = (json.features || [])
            .map(f => (f.attributes && (f.attributes[VILLAGE_FIELD] || f.attributes[VILLAGE_FIELD.toLowerCase()])))
            .filter(Boolean)
            .sort((a, b) => a.localeCompare(b));
          for (const village of villages) {
            const opt = document.createElement('option');
            opt.value = village;
            opt.textContent = village;
            villageSelect.appendChild(opt);
          }
        })
        .catch(err => {
          console.warn('Failed to load villages', err);
        })
        .finally(() => {
          villageSelect.disabled = false;
        });
    });


    // Fetch & display layers on button click
    document.getElementById('fetch-btn').onclick = () => {
      const state = document.getElementById('state-select').value;
      const district = document.getElementById('district-select').value;
      const village = document.getElementById('village-select').value;
      if (!state) {
        alert('Please select a state.');
        return;
      }
      // Clear previous layers
      clearAllLayers();
      // Status update
      setStatus('state-status', 'Loading...', false);
      setStatus('district-status', 'Loading...', false);
      setStatus('village-status', 'Loading...', false);
      setStatus('water-status', 'Loading...', false);

      // Fetch & show layers as per checkbox
      if (document.getElementById('state-boundary').checked) {
        showStateBoundary(state);
      } else setStatus('state-status', 'Not loaded', true);

      if (document.getElementById('district-boundary').checked) {
        showDistrictBoundary(state, district);
      } else setStatus('district-status', 'Not loaded', true);

      if (document.getElementById('village-boundary').checked) {
        showVillageBoundary(state, district, village);
      } else setStatus('village-status', 'Not loaded', true);

      if (document.getElementById('water-bodies').checked) {
        showWaterBodies(state, district);
      } else setStatus('water-status', 'Not loaded', true);
    };

    document.getElementById('clear-btn').onclick = clearAllLayers;
    document.getElementById('reset-btn').onclick = () => {
      map.flyTo({ center: [83, 21.5], zoom: 5.2 });
    };

    function clearAllLayers() {
      removeLayerAndSource('state-boundary-layer');
      removeLayerAndSource('district-boundary-layer');
      removeLayerAndSource('village-boundary-layer');
      removeLayerAndSource('water-bodies-layer');
      setStatus('state-status', '', true);
      setStatus('district-status', '', true);
      setStatus('village-status', '', true);
      setStatus('water-status', '', true);
    }

    // Display State Boundary
    async function showStateBoundary(stateName) {
      const code = STATE_CODE[stateName];
      const candidates = [
        `State_Name='${esc(code)}'`,      // by code (TR)
        `State_FSI='${esc(stateName)}'`   // by name (Tripura)
      ];

      let data = null;
      for (const where of candidates) {
        const qs = new URLSearchParams({ where, outFields: '*', f: 'geojson' });
        const res = await fetch(`${STATE_SERVICE}/query?${qs.toString()}`);
        const j = await res.json();
        if (j?.features?.length) { data = j; break; }
      }

      if (!data) { setStatus('state-status', 'Error', false); return; }

      if (map.getSource('state-boundary-layer')) {
        map.getSource('state-boundary-layer').setData(data);
      } else {
        map.addSource('state-boundary-layer', { type: 'geojson', data });
        map.addLayer({
          id: 'state-boundary-layer',
          type: 'line',
          source: 'state-boundary-layer',
          paint: { 'line-color': '#ffb300', 'line-width': 4 }
        });
      }
      setStatus('state-status', 'Loaded', false);

      const bbox = turf.bbox(data);
      map.fitBounds(bbox, { padding: 40, duration: 1000 });
    }




    // Display District Boundary
    async function showDistrictBoundary(stateName, districtName) {
      const code = STATE_CODE[stateName];
      const parts = [`State='${esc(code)}'`];           // code e.g., TR
      if (districtName) parts.push(`District='${esc(districtName)}'`); // name e.g., Sepahijala
      const where = parts.join(' AND ');

      const qs = new URLSearchParams({ where, outFields: '*', f: 'geojson' });
      const res = await fetch(`${DISTRICT_SERVICE}/query?${qs.toString()}`);
      const data = await res.json();

      if (map.getSource('district-boundary-layer')) {
        map.getSource('district-boundary-layer').setData(data);
      } else {
        map.addSource('district-boundary-layer', { type: 'geojson', data });
        map.addLayer({
          id: 'district-boundary-layer',
          type: 'line',
          source: 'district-boundary-layer',
          paint: { 'line-color': '#e53935', 'line-width': 2 }
        });
      }
      setStatus('district-status', `Loaded${data.features?.length ? ` (${data.features.length})` : ''}`, true);
    }



    // Display Village Boundary (State -> optional District -> optional Village)
    async function showVillageBoundary(stateName, districtName, villageName) {
      const parts = [`State='${esc(stateName)}'`];          // e.g., Tripura
      if (districtName) parts.push(`District='${esc(districtName)}'`); // e.g., Gomati
      if (villageName) parts.push(`Name='${esc(villageName)}'`);      // e.g., Khupilong Part
      const where = parts.join(' AND ');

      const qs = new URLSearchParams({
        where, outFields: 'State,District,Name', f: 'geojson'
      });

      const res = await fetch(`${VILLAGE_SERVICE}/query?${qs.toString()}`);
      const data = await res.json();
      if (!data?.features) { setStatus('village-status', 'Error', false); return; }

      if (map.getSource('village-boundary-layer')) {
        map.getSource('village-boundary-layer').setData(data);
      } else {
        map.addSource('village-boundary-layer', { type: 'geojson', data });
        map.addLayer({
          id: 'village-boundary-layer',
          type: 'line',
          source: 'village-boundary-layer',
          paint: { 'line-color': '#43a047', 'line-width': 1.5 }
        });
      }
      setStatus('village-status', `Loaded (${data.features.length})`, false);
    }



    // Display Water Bodies
    async function showWaterBodies(stateName, districtName) {
      const layerUrl = WATER_LAYER_BY_STATE[stateName];
      if (!layerUrl) { setStatus('water-status', 'Not available', false); return; }

      const code = STATE_CODE[stateName]; // TR
      const parts = [`state='${esc(code)}'`];                   // lowercase field
      if (districtName) parts.push(`district='${esc(districtName)}'`); // name (e.g., Sepahijala)
      // Optionally you can also filter village if you expose it in UI:
      // if (villageName) parts.push(`village='${esc(villageName)}'`);

      const where = parts.join(' AND ');
      const qs = new URLSearchParams({ where, outFields: '*', f: 'geojson' });

      const res = await fetch(`${layerUrl}/query?${qs.toString()}`);
      const data = await res.json();

      if (map.getSource('water-bodies-layer')) {
        map.getSource('water-bodies-layer').setData(data);
      } else {
        map.addSource('water-bodies-layer', { type: 'geojson', data });
        map.addLayer({
          id: 'water-bodies-layer',
          type: 'fill',
          source: 'water-bodies-layer',
          paint: { 'fill-color': '#1976d2', 'fill-opacity': 0.55 }
        });
      }
      setStatus('water-status', `Loaded (${data.features?.length || 0})`, false);
    }


    // Turf.js for bbox calculation (add from CDN)
    const turfScript = document.createElement('script');
    turfScript.src = 'https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js';
    document.head.appendChild(turfScript);
  </script>
</body>

</html>
