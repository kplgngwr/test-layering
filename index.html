<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Dynamic Layer Fetch & Overlay Demo</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .control-panel,
    .legend-panel {
      position: absolute;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      padding: 18px 16px 14px 16px;
      z-index: 10;
      font-size: 15px;
      max-width: 340px;
    }

    .control-panel {
      top: 18px;
      left: 30px;
    }

    .legend-panel {
      bottom: 24px;
      left: 30px;
    }

    .legend-panel label {
      margin-left: 6px;
    }

    .legend-panel input[type=checkbox] {
      vertical-align: middle;
      margin-right: 3px;
    }

    .legend-panel .layer-status {
      font-size: 12px;
      margin-left: 8px;
      color: #388e3c;
    }

    .legend-panel .layer-status.cache {
      color: #999;
    }

    button,
    select {
      margin: 8px 0;
      width: 90%;
      font-size: 15px;
    }

    .layer-color {
      display: inline-block;
      width: 15px;
      height: 15px;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 5px;
    }

    .layer-color.state {
      background: #ffb300;
    }

    .layer-color.district {
      background: #e53935;
    }

    .layer-color.water {
      background: #1976d2;
    }

    .layer-color.village {
      background: #43a047;
    }

    .desc {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="control-panel">
    <label for="state-select">State</label>
    <select id="state-select">
      <option value="">Select State</option>
      <option value="Odisha">Odisha</option>
      <option value="Madhya Pradesh">Madhya Pradesh</option>
      <option value="Tripura">Tripura</option>
      <option value="Telangana">Telangana</option>
    </select>

    <label for="district-select">District</label>
    <select id="district-select">
      <option value="">-- All Districts --</option>
    </select>

    <label for="village-select">Village</label>
    <select id="village-select" disabled>
      <option value="">-- All Villages --</option>
    </select>

    <button id="fetch-btn">Fetch Layer(s)</button>
    <button id="reset-btn">Reset View</button>
    <button id="clear-btn">Clear Layers</button>

    <div class="desc">
      1. Select a State (required). 2. Select a District to enable Villages.<br>
      3. Tick desired layers in legend. 4. Click Fetch Layer(s).
    </div>
  </div>

  <div class="legend-panel">
    <b>Layers (select & then Fetch)</b><br>
    <input type="checkbox" id="state-boundary" checked>
    <span class="layer-color state"></span>
    <label for="state-boundary">State Boundary</label>
    <span id="state-status" class="layer-status cache"></span><br>

    <input type="checkbox" id="district-boundary" checked>
    <span class="layer-color district"></span>
    <label for="district-boundary">District Boundary</label>
    <span id="district-status" class="layer-status cache"></span><br>

    <input type="checkbox" id="village-boundary" checked>
    <span class="layer-color village"></span>
    <label for="village-boundary">Village Boundary</label>
    <span id="village-status" class="layer-status cache"></span><br>

    <input type="checkbox" id="water-bodies" checked>
    <span class="layer-color water"></span>
    <label for="water-bodies">Surface Water Bodies</label>
    <span id="water-status" class="layer-status"></span><br>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoicm9oaXRiaGF0dDI0MzciLCJhIjoiY21mbWRia3NzMDBzMDJrc2J6cXg5aTBqeCJ9.d9SBYA8rSq4chTptEmx69w';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [83, 21.5],
      zoom: 5.2
    });

    // === ArcGIS endpoints ===
    const STATE_SERVICE = 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/state_boundary/FeatureServer/0';
    const DISTRICT_SERVICE = 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/district_boundary/FeatureServer/0';
    const VILLAGE_SERVICE = 'https://livingatlas.esri.in/server/rest/services/IAB2024/IAB_Village_2024/MapServer/0';

    const WATER_LAYER_BY_STATE = {
      'Madhya Pradesh': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Madhya_pradesh_water_bodies/FeatureServer/0',
      'Tripura': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Tripura_water_bodies/FeatureServer/0',
      'Telangana': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Telangana_Water__Bodies/FeatureServer/0',
      'Odisha': 'https://services5.arcgis.com/73n8CSGpSSyHr1T9/arcgis/rest/services/Odisha_water_bodies/FeatureServer/0'
    };

    // State name <-> code (your mixed data model)
    const STATE_CODE = { 'Odisha': 'OD', 'Madhya Pradesh': 'MP', 'Tripura': 'TR', 'Telangana': 'TS' };

    // UI elements
    const stateSelect = document.getElementById('state-select');
    const districtSelect = document.getElementById('district-select');
    const villageSelect = document.getElementById('village-select');

    // Utils
    function esc(s) { return String(s).replace(/'/g, "''"); }
    function setStatus(id, msg, isCache = false) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'layer-status' + (isCache ? ' cache' : '');
    }
    function removeLayerAndSource(id) {
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);
    }
    function addOrUpdateGeoJSONSource(sourceId, data) {
      if (map.getSource(sourceId)) map.getSource(sourceId).setData(data);
      else map.addSource(sourceId, { type: 'geojson', data });
    }
    function resetVillageSelect() {
      villageSelect.innerHTML = `<option value="">-- All Villages --</option>`;
      villageSelect.disabled = true;
      setStatus('village-status', 'Select a district', true);
    }

    // Abort controllers to avoid stale overwrites
    let abortDistricts = null;
    let abortVillages = null;

    // === Data loaders ===
    async function loadDistrictsForState(stateName) {
      const code = STATE_CODE[stateName];
      if (!code) return [];

      if (abortDistricts) abortDistricts.abort();
      abortDistricts = new AbortController();

      const params = new URLSearchParams({
        where: `State='${esc(code)}'`,   // district_boundary: State (code)
        outFields: 'District',           // exact case
        returnDistinctValues: 'true',
        orderByFields: 'District',
        returnGeometry: 'false',
        f: 'json'
      });

      const res = await fetch(`${DISTRICT_SERVICE}/query?${params.toString()}`, { signal: abortDistricts.signal });
      const json = await res.json();

      return (json.features || [])
        .map(f => f?.attributes?.District)
        .filter(Boolean)
        .map(s => s.trim())
        .filter((v, i, a) => a.indexOf(v) === i)
        .sort((a, b) => a.localeCompare(b));
    }

    async function loadVillagesForStateDistrict(stateName, districtName) {
      if (!stateName || !districtName) return [];

      // Abort previous
      if (abortVillages) abortVillages.abort();
      abortVillages = new AbortController();

      // Case-insensitive WHERE (prevents subtle mismatches)
      const where = [
        `UPPER(State)=UPPER('${esc(stateName)}')`,
        `UPPER(District)=UPPER('${esc(districtName)}')`
      ].join(' AND ');

      // Use statistics + groupBy for true distincts, and paginate with resultOffset
      const stats = JSON.stringify([
        { statisticType: 'count', onStatisticField: 'Name', outStatisticFieldName: 'cnt' }
      ]);

      const pageSize = 2000;     // safe high page size
      let resultOffset = 0;
      let villages = new Set();

      while (true) {
        const params = new URLSearchParams({
          where,
          outFields: 'Name',
          groupByFieldsForStatistics: 'Name',
          outStatistics: stats,
          orderByFields: 'Name',
          returnGeometry: 'false',
          f: 'json',
          resultOffset: String(resultOffset),
          resultRecordCount: String(pageSize)
        });

        const url = `${VILLAGE_SERVICE}/query?${params.toString()}`;
        const res = await fetch(url, { signal: abortVillages.signal });
        const json = await res.json();

        if (json.error) throw new Error(`ArcGIS error: ${JSON.stringify(json.error)}`);

        const feats = json.features || [];
        for (const f of feats) {
          const n = (f?.attributes?.Name ?? f?.attributes?.name ?? '').trim();
          if (n) villages.add(n);
        }

        // If server signals more data, continue paging
        if (json.exceededTransferLimit && feats.length > 0) {
          resultOffset += feats.length;
        } else {
          break;
        }
      }

      return [...villages].sort((a, b) => a.localeCompare(b));
    }


    // === Event wiring ===
    stateSelect.addEventListener('change', async function () {
      const stateName = this.value;

      // reset dependents
      districtSelect.innerHTML = `<option value="">-- All Districts --</option>`;
      districtSelect.disabled = true;
      resetVillageSelect();

      if (!stateName) return;

      try {
        const districts = await loadDistrictsForState(stateName);
        for (const d of districts) {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = d;
          districtSelect.appendChild(opt);
        }
      } catch (e) {
        console.warn('Failed to load districts', e);
      } finally {
        districtSelect.disabled = false;
      }
    });

    districtSelect.addEventListener('change', async function () {
      const stateName = stateSelect.value;
      const districtName = this.value;

      resetVillageSelect();
      if (!districtName) return;

      try {
        setStatus('village-status', 'Loading...', false);
        const villages = await loadVillagesForStateDistrict(stateName, districtName);
        for (const v of villages) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          villageSelect.appendChild(opt);
        }
        villageSelect.disabled = false;
        setStatus('village-status', `Loaded (${villages.length})`, false);
      } catch (e) {
        setStatus('village-status', 'Error', false);
        console.warn('Failed to load villages', e);
      }
    });

    // === Buttons ===
    document.getElementById('fetch-btn').onclick = () => {
      const state = stateSelect.value;
      const district = districtSelect.value;
      const village = villageSelect.value;

      if (!state) {
        alert('Please select a state.');
        return;
      }

      clearAllLayers();
      setStatus('state-status', 'Loading...', false);
      setStatus('district-status', 'Loading...', false);
      setStatus('village-status', 'Loading...', false);
      setStatus('water-status', 'Loading...', false);

      if (document.getElementById('state-boundary').checked) {
        showStateBoundary(state);
      } else setStatus('state-status', 'Not loaded', true);

      if (document.getElementById('district-boundary').checked) {
        showDistrictBoundary(state, district);
      } else setStatus('district-status', 'Not loaded', true);

      if (document.getElementById('village-boundary').checked) {
        if (!district) {
          setStatus('village-status', 'Select a district to load villages', false);
        } else {
          showVillageBoundary(state, district, village);
        }
      } else setStatus('village-status', 'Not loaded', true);

      if (document.getElementById('water-bodies').checked) {
        showWaterBodies(state, district);
      } else setStatus('water-status', 'Not loaded', true);
    };

    document.getElementById('clear-btn').onclick = clearAllLayers;
    document.getElementById('reset-btn').onclick = () => {
      map.flyTo({ center: [83, 21.5], zoom: 5.2 });
    };

    function clearAllLayers() {
      removeLayerAndSource('state-boundary-layer');
      removeLayerAndSource('district-boundary-layer');
      removeLayerAndSource('village-boundary-layer');
      removeLayerAndSource('water-bodies-layer');
      setStatus('state-status', '', true);
      setStatus('district-status', '', true);
      setStatus('village-status', '', true);
      setStatus('water-status', '', true);
    }

    // === Renderers ===
    async function showStateBoundary(stateName) {
      const code = STATE_CODE[stateName];
      const candidates = [
        `State_Name='${esc(code)}'`,    // code e.g., TR
        `State_FSI='${esc(stateName)}'` // name e.g., Tripura
      ];

      let data = null;
      for (const where of candidates) {
        const qs = new URLSearchParams({ where, outFields: '*', f: 'geojson' });
        try {
          const res = await fetch(`${STATE_SERVICE}/query?${qs.toString()}`);
          const j = await res.json();
          if (j?.features?.length) { data = j; break; }
        } catch (_) { }
      }

      if (!data) { setStatus('state-status', 'Error', false); return; }

      addOrUpdateGeoJSONSource('state-boundary-layer', data);
      if (!map.getLayer('state-boundary-layer')) {
        map.addLayer({
          id: 'state-boundary-layer',
          type: 'line',
          source: 'state-boundary-layer',
          paint: { 'line-color': '#ffb300', 'line-width': 4 }
        });
      }
      setStatus('state-status', 'Loaded', false);

      const bbox = turf.bbox(data);
      map.fitBounds(bbox, { padding: 40, duration: 1000 });
    }

    async function showDistrictBoundary(stateName, districtName) {
      const code = STATE_CODE[stateName];
      const parts = [`State='${esc(code)}'`];
      if (districtName) parts.push(`District='${esc(districtName)}'`);
      const where = parts.join(' AND ');

      const qs = new URLSearchParams({ where, outFields: '*', f: 'geojson' });
      try {
        const res = await fetch(`${DISTRICT_SERVICE}/query?${qs.toString()}`);
        const data = await res.json();

        addOrUpdateGeoJSONSource('district-boundary-layer', data);
        if (!map.getLayer('district-boundary-layer')) {
          map.addLayer({
            id: 'district-boundary-layer',
            type: 'line',
            source: 'district-boundary-layer',
            paint: { 'line-color': '#e53935', 'line-width': 2 }
          });
        }
        setStatus('district-status', `Loaded${data.features?.length ? ` (${data.features.length})` : ''}`, true);
      } catch {
        setStatus('district-status', 'Error', false);
      }
    }

    async function showVillageBoundary(stateName, districtName, villageName) {
      if (!districtName) { setStatus('village-status', 'Select a district', false); return; }

      const parts = [`State='${esc(stateName)}'`, `District='${esc(districtName)}'`];
      if (villageName) parts.push(`Name='${esc(villageName)}'`);
      const where = parts.join(' AND ');

      const qs = new URLSearchParams({ where, outFields: 'State,District,Name', f: 'geojson' });
      try {
        const res = await fetch(`${VILLAGE_SERVICE}/query?${qs.toString()}`);
        const data = await res.json();
        if (!data?.features) { setStatus('village-status', 'Error', false); return; }

        addOrUpdateGeoJSONSource('village-boundary-layer', data);
        if (!map.getLayer('village-boundary-layer')) {
          map.addLayer({
            id: 'village-boundary-layer',
            type: 'line',
            source: 'village-boundary-layer',
            paint: { 'line-color': '#43a047', 'line-width': 1.5 }
          });
        }
        setStatus('village-status', `Loaded (${data.features.length})`, false);

        if (!map.getSource('state-boundary-layer') && data.features.length) {
          const bbox = turf.bbox(data);
          map.fitBounds(bbox, { padding: 40, duration: 1000 });
        }
      } catch {
        setStatus('village-status', 'Error', false);
      }
    }

    async function showWaterBodies(stateName, districtName) {
      const layerUrl = WATER_LAYER_BY_STATE[stateName];
      if (!layerUrl) { setStatus('water-status', 'Not available', false); return; }

      const code = STATE_CODE[stateName]; // lowercase fields in these services
      const parts = [`state='${esc(code)}'`];
      if (districtName) parts.push(`district='${esc(districtName)}'`);
      const where = parts.join(' AND ');

      const qs = new URLSearchParams({ where, outFields: '*', f: 'geojson' });
      try {
        const res = await fetch(`${layerUrl}/query?${qs.toString()}`);
        const data = await res.json();

        addOrUpdateGeoJSONSource('water-bodies-layer', data);
        if (!map.getLayer('water-bodies-layer')) {
          map.addLayer({
            id: 'water-bodies-layer',
            type: 'fill',
            source: 'water-bodies-layer',
            paint: { 'fill-color': '#1976d2', 'fill-opacity': 0.55 }
          });
        }
        setStatus('water-status', `Loaded (${data.features?.length || 0})`, false);
      } catch {
        setStatus('water-status', 'Error', false);
      }
    }

    // Turf for bbox
    const turfScript = document.createElement('script');
    turfScript.src = 'https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js';
    document.head.appendChild(turfScript);
  </script>
</body>

</html>
